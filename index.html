<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مؤسسة الميثاق التنفيذية — نظام إدارة مهام المكتب التنفيذي</title>
<style>
:root{
  /* re-themed 2026-09-23 to match the Defence Industries System — Masad Sudan emblem's own palette (navy / green / orange-gold / red) */
  --navy:#1b2a63; --navy2:#2c3f8f; --gold:#f2a93c; --teal:#1a7a3e;
  --bg:#f4f6f9; --card:#ffffff; --border:#e3e7ee; --text:#1f2937; --muted:#6b7280;
  --danger:#cf1f2b; --warn:#d97706; --ok:#16a34a; --info:#2563eb;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);}
[dir="ltr"]{direction:ltr;}
.app{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center;}
.sidebar .brand .brandlogo{width:64px;height:auto;display:block;margin:0 auto 10px;border-radius:6px;background:#fff;padding:4px;}
.sidebar .brand .name{font-weight:700;font-size:15px;}
.sidebar .brand .sub{font-size:11px;opacity:.65;margin-top:3px;}
.nav{flex:1;padding:10px 0;overflow-y:auto;}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#cbd5e1;text-decoration:none;font-size:13.5px;cursor:pointer;border-inline-start:3px solid transparent;}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav a.active{background:rgba(255,255,255,.1);color:#fff;border-inline-start-color:var(--gold);font-weight:600;}
.nav a .ic{width:18px;text-align:center;}
.sidebar .roleinfo{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.7;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;}
.topbar h1{font-size:16px;margin:0;flex:1;}
.topbar .ctrl{display:flex;align-items:center;gap:10px;}
select, button, input{font-family:inherit;}
.roleSelect{padding:7px 10px;border-radius:8px;border:1px solid var(--border);font-size:12.5px;background:#fff;}
.langbtn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;font-weight:600;}
.bellwrap{position:relative;}
.bell{width:36px;height:36px;border-radius:50%;background:#f1f3f7;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;}
.bell .dot{position:absolute;top:4px;inset-inline-end:4px;width:8px;height:8px;background:var(--danger);border-radius:50%;}
.notifpanel{position:absolute;top:44px;inset-inline-end:0;width:320px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;max-height:400px;overflow-y:auto;z-index:50;}
.notifpanel.show{display:block;}
.notifpanel .nh{padding:12px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--border);}
.notifitem{padding:11px 14px;border-bottom:1px solid #f0f1f4;font-size:12.5px;}
.notifitem b{display:block;font-size:12.5px;margin-bottom:3px;}
.notifitem .t{color:var(--muted);font-size:11px;}
.notifitem.unread{background:#f7faff;}
.content{padding:22px;flex:1;overflow-y:auto;}
.page{display:none;}
.page.active{display:block;}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.pagehead h2{margin:0;font-size:19px;}
.pagehead .desc{font-size:12.5px;color:var(--muted);margin-top:4px;}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;cursor:pointer;font-weight:600;}
.btn.gold{background:var(--gold);color:#1f2937;}
.btn.outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn.sm{padding:6px 11px;font-size:11.5px;}
.btn.ok{background:var(--ok);color:#fff;}
.btn.danger{background:var(--danger);color:#fff;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.kpi .num{font-size:26px;font-weight:800;margin:4px 0;}
.kpi .lbl{font-size:12px;color:var(--muted);}
.kpi .trend{font-size:11px;}
.kpi .trend.up{color:var(--ok);} .kpi .trend.down{color:var(--danger);}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;}
th,td{padding:10px 12px;text-align:start;font-size:12.5px;border-bottom:1px solid #eef0f4;}
th{background:#f8f9fb;font-weight:700;color:#475569;font-size:11.5px;}
tr:hover td{background:#fafbfd;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.badge.new{background:#e0e7ff;color:#3730a3;}
.badge.progress{background:#fef3c7;color:#92400e;}
.badge.hold{background:#f3f4f6;color:#4b5563;}
.badge.done{background:#dcfce7;color:#166534;}
.badge.cancel{background:#fee2e2;color:#991b1b;}
.badge.pending{background:#fef3c7;color:#92400e;}
.badge.approved{background:#dcfce7;color:#166534;}
.badge.rejected{background:#fee2e2;color:#991b1b;}
.quad{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;}
.q1{background:var(--danger);} .q2{background:var(--warn);} .q3{background:var(--info);} .q4{background:#9ca3af;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;}
.viewtoggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.viewtoggle button{border:none;background:#fff;padding:7px 14px;font-size:12px;cursor:pointer;}
.viewtoggle button.active{background:var(--navy);color:#fff;}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kcol{background:#eef1f5;border-radius:10px;padding:10px;min-height:120px;}
.kcol h4{font-size:12.5px;margin:2px 6px 10px;display:flex;justify-content:space-between;}
.kcard{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:12px;cursor:pointer;}
.kcard .ti{font-weight:700;margin-bottom:4px;}
.kcard .meta{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;margin-top:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:14px;padding:22px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;}
.insider-avatar{width:72px;height:72px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.myavatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.myavatar:hover{outline:2px solid var(--gold);outline-offset:1px;}
.insider-row{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;text-align:start;}
.insider-row span{color:var(--muted);}
.userlink{color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
.modal h3{margin-top:0;font-size:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#374151;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
.field textarea{min-height:70px;resize:vertical;}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.timeline{border-inline-start:2px solid var(--border);margin-inline-start:8px;padding-inline-start:18px;}
.tlitem{position:relative;padding-bottom:18px;}
.tlitem::before{content:"";position:absolute;inset-inline-start:-24px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--teal);}
.tlitem .h{font-weight:700;font-size:12.5px;}
.tlitem .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
.attachment{display:inline-flex;align-items:center;gap:6px;background:#f1f3f7;padding:5px 10px;border-radius:7px;font-size:11.5px;margin-inline-end:6px;}
.section-title{font-size:14px;font-weight:700;margin:18px 0 10px;}
.pill{padding:2px 9px;border-radius:999px;background:#f1f3f7;font-size:11px;}
.rbacmatrix td.yes{color:var(--ok);font-weight:700;text-align:center;}
.rbacmatrix td.no{color:#d1d5db;text-align:center;}
.agenda-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #eef0f4;}
.agenda-time{width:70px;font-weight:700;font-size:13px;color:var(--navy);flex-shrink:0;}
.agenda-body{flex:1;}
.agenda-actions{display:flex;gap:6px;}
.searchbox{display:flex;gap:8px;margin-bottom:14px;}
.searchbox input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;}
.rescat{margin-bottom:18px;}
.rescat h4{font-size:13px;margin-bottom:8px;color:var(--navy);}
.reslist .resitem{padding:9px 0;border-bottom:1px solid #f0f1f4;font-size:12.5px;display:flex;justify-content:space-between;}
.tabs2{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);}
.tabs2 button{background:none;border:none;padding:10px 14px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
.tabs2 button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:700;}
.tabpage{display:none;} .tabpage.active{display:block;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;} .kanban{grid-template-columns:1fr 1fr;}}

.repfilters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.svgbar-wrap{display:flex;align-items:flex-end;gap:14px;height:190px;padding:10px 4px 0;}
.svgbar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.svgbar{width:100%;max-width:52px;border-radius:6px 6px 0 0;background:var(--navy2);transition:height .3s;cursor:pointer;position:relative;}
.svgbar:hover{opacity:.85;}
.svgbar .val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;}
.svgbar-lbl{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;max-width:70px;}
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut{width:150px;height:150px;border-radius:50%;flex-shrink:0;}
.donutlegend{flex:1;min-width:160px;}
.legrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;cursor:pointer;border-radius:6px;padding-inline-start:6px;}
.legrow:hover{background:#f4f6f9;}
.legrow.selected{background:#eef2ff;font-weight:700;}
.legdot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.trendsvg{width:100%;height:120px;}
.trendpt{cursor:pointer;}
.trendpt:hover{r:6;}
.drilldown{margin-top:16px;}
.drilldown table{margin-top:8px;}
</style>
</head>

/* ============ Nav / Role / Page Switching ============ */
function buildRoleSelect(){
  const sel = document.getElementById("roleSelect");
  sel.innerHTML = "";
  Object.values(ROLES).forEach(r=>{
    const opt = document.createElement("option");
    opt.value = r.key; opt.textContent = t(r.labelKey);
    if(r.key === currentRole) opt.selected = true;
    sel.appendChild(opt);
  });
}
function switchRole(roleKey){
  currentRole = roleKey;
  buildNav();
  document.getElementById("roleLabel").textContent = t(ROLES[currentRole].labelKey);
  updateMyAvatar();
  const allowed = ROLES[currentRole].nav;
  navigateTo(allowed.includes(currentPage) ? currentPage : allowed[0]);
}
function updateMyAvatar(){
  const uid = REP_USER[currentRole];
  const u = USERS.find(x=>x.id===uid);
  const el = document.getElementById("myAvatar");
  if(el) el.textContent = u ? initials(u.name) : "";
}
function buildNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  const allowed = ROLES[currentRole].nav;
  NAV_ITEMS.filter(item=>allowed.includes(item.id)).forEach(item=>{
    const a = document.createElement("a");
    a.className = "navlink" + (item.id === currentPage ? " active" : "");
    a.onclick = ()=>navigateTo(item.id);
    a.innerHTML = `<span class="ic">${item.icon}</span><span data-i18n="${item.labelKey}">${t(item.labelKey)}</span>`;
    nav.appendChild(a);
  });
}
let currentPage = "home";
const PAGE_TITLE_KEY = {home:"home_title",tasks:"tasks_title",corr:"corr_title",notif:"notif_title",archive:"archive_title",reports:"reports_title",agenda:"agenda_title",admin:"admin_title"};
function navigateTo(page){
  currentPage = page;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page_"+page).classList.add("active");
  document.getElementById("pageTitle").textContent = t(PAGE_TITLE_KEY[page]);
  buildNav();
  document.getElementById("notifPanel").classList.remove("show");
  renderPage(page);
}
function toggleNotif(){ document.getElementById("notifPanel").classList.toggle("show"); }
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join(""); }
function openInsider(userId){
  const u = USERS.find(x=>x.id===userId); if(!u) return;
  document.getElementById("insiderAvatar").textContent = initials(u.name);
  document.getElementById("insiderName").textContent = u.name;
  document.getElementById("insiderRole").textContent = t(ROLES[u.role].labelKey);
  document.getElementById("insiderDept").textContent = u.dept;
  document.getElementById("insiderEmail").innerHTML = `<a href="mailto:${u.email}" style="color:var(--navy);">${u.email}</a>`;
  document.getElementById("insiderPhone").innerHTML = `<a href="tel:${u.phone.replace(/\s+/g,'')}" style="color:var(--navy);">${u.phone}</a>`;
  openModal("insiderModalBg");
}
function openMyProfile(){

const TREND_DATASETS = {
  "7d":[78,80,79,82,84,83,85],
  "30d":[62,66,68,71,73,75,79,82],
  "quarter":[48,53,58,61,65,68,72,75,79,82]
};
let repPeriod = "30d";
let repDeptFilter = "";
let repStatusFilter = "";

function filteredReportTasks(){
  return TASKS.filter(x=> (!repDeptFilter || x.dept===repDeptFilter) && (!repStatusFilter || x.status===repStatusFilter) );
}
function setRepDept(v){ repDeptFilter = v; renderReports(); }
function setRepPeriod(v){ repPeriod = v; renderReports(); }
function setRepStatus(s){ repStatusFilter = (repStatusFilter===s) ? "" : s; renderReports(); }

function renderReports(){
  const data = filteredReportTasks();
  const total = data.length;
  const doneCount = data.filter(x=>x.status==="done").length;
  const rate = total ? Math.round((doneCount/total)*100) : 0;
  const overdue = data.filter(x=>x.status!=="done"&&x.status!=="cancel"&&new Date(x.due)<new Date("2026-09-15")).length;

  const deptCounts = DEPTS.map(d=> (repStatusFilter? TASKS.filter(x=>x.dept===d && x.status===repStatusFilter) : TASKS.filter(x=>x.dept===d)).length );
  const maxDept = Math.max(1, ...deptCounts);

  const statuses = ["new","progress","hold","done","cancel"];
  const statusColors = {new:"#3730a3",progress:"#92400e",hold:"#4b5563",done:"#166534",cancel:"#991b1b"};
  const baseForStatus = repDeptFilter ? TASKS.filter(x=>x.dept===repDeptFilter) : TASKS;
  const statusCounts = statuses.map(s=>baseForStatus.filter(x=>x.status===s).length);
  const statusTotal = statusCounts.reduce((a,b)=>a+b,0) || 1;
  let acc = 0;
  const gradientParts = statuses.map((s,i)=>{
    const pct = statusCounts[i]/statusTotal*100;
    const part = `${statusColors[s]} ${acc}% ${acc+pct}%`;
    acc += pct;
    return part;
  });
  const donutStyle = `background:conic-gradient(${gradientParts.join(",")});`;

  const trend = TREND_DATASETS[repPeriod];
  const w = 560, h = 110, pad = 8;
  const stepX = (w - pad*2) / (trend.length-1);
  const minV = Math.min(...trend), maxV = Math.max(...trend);
  const scaleY = v => h - pad - ((v-minV)/((maxV-minV)||1))*(h-pad*2);
  const points = trend.map((v,i)=>[pad+i*stepX, scaleY(v)]);
  const polyline = points.map(p=>p.join(",")).join(" ");
  const circles = points.map((p,i)=>`<circle class="trendpt" cx="${p[0]}" cy="${p[1]}" r="4" fill="#c9a227" title="${trend[i]}%"></circle>`).join("");

  document.getElementById("page_reports").innerHTML = `
    <div class="pagehead"><div><h2>${t("reports_title")}</h2><div class="desc">${t("reports_desc")}</div></div>
      <div><button class="btn outline sm" onclick="alert('${t('exportPdf')}')">${t("exportPdf")}</button> <button class="btn outline sm" onclick="alert('${t('exportExcel')}')">${t("exportExcel")}</button></div></div>
    <div class="repfilters">
      <select onchange="setRepDept(this.value)">
        <option value="" ${!repDeptFilter?"selected":""}>${t('filterByDept')}</option>
        ${DEPTS.map(d=>`<option ${repDeptFilter===d?"selected":""}>${d}</option>`).join("")}
      </select>
      <select onchange="setRepPeriod(this.value)">
        <option value="7d" ${repPeriod==="7d"?"selected":""}>7 ${currentLang==='ar'?'أيام الماضية':'days'}</option>
        <option value="30d" ${repPeriod==="30d"?"selected":""}>30 ${currentLang==='ar'?'يوم الماضية':'days'}</option>
        <option value="quarter" ${repPeriod==="quarter"?"selected":""}>${currentLang==='ar'?'هذا الربع':'This quarter'}</option>
      </select>
    </div>
    <div class="cards">
      <div class="card kpi"><div class="lbl">${t("kpi_open")}</div><div class="num">${total-doneCount-data.filter(x=>x.status==='cancel').length}</div></div>
      <div class="card kpi"><div class="lbl">${t("kpi_overdue")}</div><div class="num" style="color:var(--danger)">${overdue}</div></div>
      <div class="card kpi"><div class="lbl">${t("kpi_rate")}</div><div class="num" style="color:var(--ok)">${rate}%</div></div>
      <div class="card kpi"><div class="lbl">${t("avgCompletion")}</div><div class="num">3.4 <span style="font-size:13px;">${t('days')}</span></div></div>
    </div>
    <div class="charts-row">
      <div class="card">
        <div class="section-title">${t("tasksByDept")}</div>
        <div class="svgbar-wrap">${DEPTS.map((d,i)=>`
          <div class="svgbar-col">
            <div class="svgbar" style="height:${(deptCounts[i]/maxDept*140)||2}px;background:${repDeptFilter===d?'var(--gold)':'var(--navy2)'}" onclick="setRepDept('${d}')">
              <span class="val">${deptCounts[i]}</span>
            </div>
            <div class="svgbar-lbl">${d}</div>
          </div>`).join("")}
        </div>
      </div>
      <div class="card">
        <div class="section-title">${t("tasksByStatus")}</div>
        <div class="donutwrap">
          <div class="donut" style="${donutStyle}"></div>
          <div class="donutlegend">${statuses.map((s,i)=>`
            <div class="legrow ${repStatusFilter===s?'selected':''}" onclick="setRepStatus('${s}')">
              <span class="legdot" style="background:${statusColors[s]}"></span> ${t(STATUS_KEY[s])} — <b>${statusCounts[i]}</b>
            </div>`).join("")}
          </div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="section-title">${t("completionTrend")}</div>
      <svg class="trendsvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline points="${polyline}" fill="none" stroke="#c9a227" stroke-width="2.5"/>
        ${circles}
      </svg>
    </div>
    ${repStatusFilter || repDeptFilter ? `
    <div class="card drilldown">
      <div class="section-title">${t("results")} (${data.length})</div>
      <table><thead><tr><th>${t("col_title")}</th><th>${t("col_dept")}</th><th>${t("col_status")}</th><th>${t("col_due")}</th></tr></thead>
      <tbody>${data.map(x=>`<tr><td>${x.title}</td><td>${x.dept}</td><td><span class="badge ${STATUS_BADGE[x.status]}">${t(STATUS_KEY[x.status])}</span></td><td>${x.due}</td></tr>`).join("")||`<tr><td colspan="4">—</td></tr>`}</tbody></table>
    </div>` : ""}
  `;
}

function renderAgenda(){
  let desc = t("agenda_desc"), listHtml = "";
  if(currentRole === "gm"){
    desc = t("agenda_desc_gm");
    const items = AGENDA.map((e,i)=>({e,i})).filter(x=>x.e.stage==="approved_gm");
    listHtml = items.length ? items.map(({e,i})=>`
      <div class="agenda-item">
        <div class="agenda-time">${e.time}</div>
        <div class="agenda-body">${e.title}<br><span class="badge ${e.status==='confirmed'?'done':'pending'}">${e.status==='confirmed'?t('secApproved'):t('st_new')}</span></div>
        <div class="agenda-actions">
          ${e.status!=='confirmed'?`<button class="btn sm ok" onclick="agendaAction(${i},'confirmed')">${t('confirm')}</button>`:""}
          <button class="btn sm outline" onclick="editAgendaTime(${i})">${t('edit')}</button>
          <button class="btn sm danger" onclick="agendaAction(${i},'cancelled')">${t('cancelEvent')}</button>
        </div>
      </div>`).join("") : `<div class="agenda-item"><div class="agenda-body">${t('gmAgendaEmpty')}</div></div>`;
  } else if(currentRole === "sec"){
    desc = t("agenda_desc_sec");
    const items = AGENDA.filter(e=>e.stage==="submitted" || e.stage==="approved_gm");
    listHtml = `
      <div class="agenda-item" style="border-bottom:2px solid var(--border);flex-wrap:wrap;">
        <div class="agenda-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <select id="secEntity"><option value="civil">${t('entCivil')}</option><option value="gov">${t('entGov')}</option><option value="mil">${t('entMil')}</option></select>
          <input id="secTime" placeholder="${t('agendaTimeLbl')}" style="width:80px;">
          <input id="secTitle" placeholder="${t('agendaTitleLbl')}" style="flex:1;min-width:160px;">
          <button class="btn sm gold" onclick="addSecretaryAgendaItem()">${t('addAgendaItem')}</button>
        </div>
      </div>` + items.map(e=>`
      <div class="agenda-item">
        <div class="agenda-time">${e.time}</div>
        <div class="agenda-body">${e.title}<br><span class="badge ${e.stage==='approved_gm'?'done':'pending'}">${e.stage==='approved_gm'?t('secApproved'):t('secSubmitted')}</span></div>
      </div>`).join("");
  } else {
    listHtml = AGENDA.map((e,i)=>`
      <div class="agenda-item">
        <div class="agenda-time">${e.time}</div>
        <div class="agenda-body">${e.title}${e.submittedBy?` <span style="font-size:11px;color:var(--muted);">(${e.submittedBy})</span>`:""}<br><span class="badge ${e.status==='confirmed'?'done':'pending'}">${e.status==='confirmed'?t('approve'):t('st_new')}</span></div>
        <div class="agenda-actions">
          ${e.stage==='submitted'?`<button class="btn sm gold" onclick="forwardAgendaToGM(${i})">${t('forwardToGM')}</button>`:""}
          ${e.status!=='confirmed'?`<button class="btn sm ok" onclick="agendaAction(${i},'confirmed')">${t('confirm')}</button>`:""}
          <button class="btn sm outline" onclick="editAgendaTime(${i})">${t('edit')}</button>
          <button class="btn sm danger" onclick="agendaAction(${i},'cancelled')">${t('cancelEvent')}</button>
        </div>
      </div>`).join("");
  }
  document.getElementById("page_agenda").innerHTML = `
    <div class="pagehead"><div><h2>${t("agenda_title")}</h2><div class="desc">${desc}</div></div></div>
    <div class="card">${listHtml}</div>`;
}
function agendaAction(i, status){ AGENDA[i].status = status; if(status==='cancelled'){ AGENDA.splice(i,1);} renderAgenda(); }
function forwardAgendaToGM(i){ AGENDA[i].status = 'confirmed'; AGENDA[i].stage = 'approved_gm'; renderAgenda(); }
function addSecretaryAgendaItem(){
  const entityEl = document.getElementById('secEntity');
  const timeEl = document.getElementById('secTime');
  const titleEl = document.getElementById('secTitle');
  if(!entityEl || !timeEl || !titleEl) return;
  const time = timeEl.value.trim(), title = titleEl.value.trim();
  if(!time || !title) return;
  AGENDA.push({time, title, status:'pending', stage:'submitted', entity: entityEl.value, submittedBy: t('roleSec')});
  renderAgenda();
}
function editAgendaTime(i){
  const item = AGENDA[i]; if(!item) return;
  const newTime = prompt(currentLang==='ar' ? "عدّل وقت الحدث (HH:MM):" : "Edit event time (HH:MM):", item.time);
  if(newTime){ item.time = newTime; renderAgenda(); }
}

let adminTab = "users";
function renderAdmin(){
  document.getElementById("page_admin").innerHTML = `
    <div class="pagehead"><div><h2>${t("admin_title")}</h2><div class="desc">${t("admin_desc")}</div></div></div>
    <div class="tabs2">
      <button class="${adminTab==='users'?'active':''}" onclick="adminTab='users';renderAdmin()">${t("tab_users")}</button>
      <button class="${adminTab==='roles'?'active':''}" onclick="adminTab='roles';renderAdmin()">${t("tab_roles")}</button>
      <button class="${adminTab==='templates'?'active':''}" onclick="adminTab='templates';renderAdmin()">${t("tab_templates")}</button>
      <button class="${adminTab==='audit'?'active':''}" onclick="adminTab='audit';renderAdmin()">${t("tab_audit")}</button>
    </div>
    <div id="adminTabBody"></div>`;
  const body = document.getElementById("adminTabBody");
  if(adminTab==="users"){
    body.innerHTML = `<div style="margin-bottom:10px;text-align:end;"><button class="btn gold sm" onclick="openModal('userModalBg')">${t('addUser')}</button></div>
      <table><thead><tr><th>${t('col_name')}</th><th>${t('col_email')}</th><th>${t('col_role')}</th><th>${t('dept')}</th><th>${t('col_active')}</th></tr></thead>
      <tbody>${USERS.map(u=>`<tr><td><span class="userlink" onclick="openInsider(${u.id})">${u.name}</span></td><td>${u.email}</td><td>${t(ROLES[u.role].labelKey)}</td><td>${u.dept}</td><td>${u.active?'✅':'—'}</td></tr>`).join("")}</tbody></table>`;
  } else if(adminTab==="roles"){
    const modules = ["nav_home","nav_tasks","nav_corr","nav_notif","nav_archive","nav_reports","nav_agenda","nav_admin"];
    body.innerHTML = `<table class="rbacmatrix"><thead><tr><th>${t('module')}</th><th>${t('perm_dg')}</th><th>${t('perm_gm')}</th><th>${t('perm_sec')}</th><th>${t('perm_mgr')}</th><th>${t('perm_emp')}</th><th>${t('perm_admin')}</th></tr></thead>
      <tbody>${modules.map(m=>{
        const id = m.replace("nav_","");
        return `<tr><td>${t(m)}</td>${["dg","gm","sec","mgr","emp","admin"].map(r=>`<td class="${ROLES[r].nav.includes(id)?'yes':'no'}">${ROLES[r].nav.includes(id)?'✔':'—'}</td>`).join("")}</tr>`;
      }).join("")}</tbody></table>`;
  } else if(adminTab==="templates"){
    body.innerHTML = `<table><thead><tr><th>${t('template')}</th></tr></thead><tbody>${TEMPLATES.map(x=>`<tr><td>${x}</td></tr>`).join("")}</tbody></table>`;
  } else {
    body.innerHTML = `<table><thead><tr><th>${t('col_name')}</th><th>${t('col_action')}</th><th>${t('col_time')}</th></tr></thead>
      <tbody>${AUDIT.map(a=>`<tr><td>${a.user}</td><td>${a.action}</td><td>${a.time}</td></tr>`).join("")}</tbody></table>`;
  }
}

function renderPage(page){
  populateAssigneeSelect();
  if(page==="home") renderHome();
  else if(page==="tasks") renderTasks();
  else if(page==="corr") renderCorr();
  else if(page==="notif") renderNotif();
  else if(page==="archive") renderArchive();
  else if(page==="reports") renderReports();
  else if(page==="agenda") renderAgenda();
  else if(page==="admin") renderAdmin();
}
function renderAll(){ buildRoleSelect(); buildNav(); document.getElementById("roleLabel").textContent = t(ROLES[currentRole].labelKey); updateMyAvatar(); renderNotifBell(); renderPage(currentPage); }

/* ============ Boot ============ */
function buildPageContainers(){
  const c = document.getElementById("content");
  let html = "";
  ["home","tasks","corr","notif","archive","reports","agenda","admin"].forEach(p=>{
    html += `<div class="page${p===currentPage?' active':''}" id="page_${p}"></div>`;
  });
  c.innerHTML = html;
}
window.addEventListener("DOMContentLoaded", ()=>{
  buildPageContainers();
  applyI18n();
  buildRoleSelect();
  buildNav();
  document.getElementById("roleLabel").textContent = t(ROLES[currentRole].labelKey);
  document.getElementById("pageTitle").textContent = t(PAGE_TITLE_KEY[currentPage]);
  renderNotifBell();
  populateAssigneeSelect();
  renderPage(currentPage);
});
</script>
</body>
</html>
